services:

  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped

    ports:
      - "8080:80"

    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:?Set NC_ADMIN_PASSWORD in .env}

    volumes:
      - nextcloud_data:/var/www/html

    networks:
      - cloud_network

  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale
    restart: unless-stopped

    # Starts the tailscale daemon to keep running, and waiting for auth
    # otherwise it restarts after 1 minute, and falls into a boot loop
    entrypoint: ["tailscaled"]
    command:
        - "--tun=userspace-networking"
        - "--statedir=/var/lib/tailscale"
        - "--socket=/var/run/tailscale/tailscaled.sock"

    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_AUTH_ONCE: "true"

    volumes:
      - tailscale_data:/var/lib/tailscale

    network_mode: "service:nextcloud"

volumes:
  nextcloud_data:
  tailscale_data:

networks:
  cloud_network:
    driver: bridge
