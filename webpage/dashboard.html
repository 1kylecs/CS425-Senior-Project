<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Personal Cloud Server Dashboard</title>
        <link rel="stylesheet" href="./dashboard.css">
        <script src="/dashboard.js" defer></script>
    </head>

    <body>
        <header>
            <h1>Personal Cloud Server</h1>
            <button id="logout-button">Log Out</button>
        </header>

        <main>
            <h2>Dashboard</h2>
            <p>Welcome <span id="username"></span></p>

            <section class="dashboard-grid">
                <div class="dashboard-card">
                    <h3>Server Status</h3>
                    <p id="server-status">Checking...</p>
                </div>

                <div class="dashboard-card">
                    <h3>My Files</h3>
                    <p>Access and manage your cloud files</p>
                    <a id="files-link" href="#" target="_blank" rel="noopener noreferrer">Open Files</a>
                </div>

                <div class="dashboard-card">
                    <h3>Tailscale</h3>
                    <p id="tailscale-status">Not connected yet</p>
                </div>
            </section>
        </main>
    </body>
</html>
